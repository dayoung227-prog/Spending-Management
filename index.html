<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지출 관리</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B2A1E">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지출 관리">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap');

:root{
  --brown-deep:#3B2A1E;
  --brown-mid:#5C4632;
  --gold:#C9A227;
  --paper:#F7F4EE;
  --card:#FFFFFF;
  --ink:#2B231C;
  --ink-soft:#8F8375;
  --red:#C0392B;
  --green:#3F7A5C;
  --line:#EAE3D6;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:#DDD7C9;
  color:var(--ink);
  font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.phone{
  max-width:400px;
  margin:0 auto;
  min-height:100vh;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 24px rgba(0,0,0,0.15);
}

/* ---- top bar ---- */
.topbar{background:var(--brown-deep);color:#F3EDE0;padding:14px 16px 0;flex-shrink:0;}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.app-title{font-weight:700;font-size:19px;letter-spacing:0.5px;}
.month-switch{display:flex;align-items:center;gap:12px;font-size:14px;}
.month-switch button{background:none;border:none;color:#F3EDE0;font-size:16px;cursor:pointer;padding:2px 4px;opacity:0.85;}
.month-switch button:hover{opacity:1;}
.summary-strip{display:flex;background:rgba(255,255,255,0.08);border-radius:8px 8px 0 0;margin-top:2px;overflow:hidden;}
.summary-cell{flex:1;text-align:center;padding:10px 4px 12px;border-right:1px solid rgba(255,255,255,0.12);}
.summary-cell:last-child{border-right:none;}
.summary-cell .label{font-size:10.5px;color:#C9BEA9;margin-bottom:4px;}
.summary-cell .value{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}

/* ---- content ---- */
.content{flex:1;overflow-y:auto;padding-bottom:90px;}
.content::-webkit-scrollbar{display:none;}

/* filter chips */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.chip.selected{background:var(--brown-deep);color:#fff;border-color:var(--brown-deep);}

/* day list */
.day-group{padding:0 14px;}
.day-header{display:flex;align-items:center;gap:10px;padding:14px 2px 8px;}
.day-badge{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3B2A1E;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.day-meta{font-size:11.5px;color:var(--ink-soft);}
.day-meta b{color:var(--ink);font-size:12.5px;}
.expense-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(43,35,28,0.06);}
.cat-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:#fff;}
.row-text{flex:1;min-width:0;}
.row-text .memo{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-text .cat-name{font-size:11px;color:var(--ink-soft);}
.row-amount{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;color:var(--red);flex-shrink:0;}
.empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.6;}

/* stats view */
.stats-section{padding:16px;}
.stats-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;letter-spacing:0.3px;}
.donut-wrap{display:flex;justify-content:center;padding:10px 0 4px;}
.donut{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.donut-hole{width:112px;height:112px;background:var(--paper);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-hole .lbl{font-size:10.5px;color:var(--ink-soft);}
.donut-hole .amt{font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px;margin-top:2px;}
.legend{margin-top:14px;}
.legend-row-wrap{padding:7px 2px 8px;border-bottom:1px solid var(--line);}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-name{width:64px;flex-shrink:0;}
.legend-pct{width:38px;color:var(--ink-soft);flex-shrink:0;}
.legend-amt{flex:1;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.legend-budget{display:flex;align-items:center;gap:8px;margin:5px 0 0 18px;}
.legend-budget-track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.legend-budget-fill{height:100%;}
.legend-budget-over{font-size:10.5px;color:var(--red);font-weight:600;white-space:nowrap;}
.legend-budget-ok{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}

.trend-wrap{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0;}
.trend-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.trend-bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;background:#D8CFBD;}
.trend-bar.current{background:var(--brown-deep);}
.trend-label{font-size:10px;color:var(--ink-soft);margin-top:6px;}
.trend-amt{font-size:9.5px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums;}

/* settings view */
.settings-section{padding:16px;}
.settings-card{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(43,35,28,0.06);}
.settings-card h4{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);}
.budget-input-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line);}
.budget-input-row:last-child{border-bottom:none;}
.budget-input-row input{width:100px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;}
.settings-btn-row{display:flex;gap:8px;}
.cat-manage-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);}
.cat-manage-row:last-child{border-bottom:none;}
.cm-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
.cm-name{flex:1;font-size:13px;}
.cm-icon-btn{background:none;border:none;font-size:14px;cursor:pointer;padding:2px 5px;}
.cm-icon-input{width:38px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:14px;}
.cm-name-input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;min-width:0;}
.cm-color-input{width:32px;height:30px;padding:1px;border:1px solid var(--line);border-radius:6px;background:none;flex-shrink:0;}
.cm-budget-input{width:78px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;flex-shrink:0;}
.add-cat-btn{width:100%;margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:none;color:var(--ink-soft);font-size:12.5px;cursor:pointer;}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--brown-deep);background:var(--brown-deep);color:#fff;font-size:13px;cursor:pointer;font-weight:600;flex:1;}
.btn.ghost{background:none;color:var(--brown-deep);}

/* fab + tabbar */
.fab{position:absolute;right:16px;bottom:82px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--brown-deep);border:none;font-size:26px;font-weight:700;box-shadow:0 3px 10px rgba(43,35,28,0.3);cursor:pointer;z-index:5;}
.tabbar{background:var(--brown-deep);display:flex;flex-shrink:0;}
.tab{flex:1;background:none;border:none;color:#B7AA92;padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;}
.tab.active{color:#F3EDE0;}
.tab .ic{font-size:18px;}

/* bottom sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(43,35,28,0.45);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.sheet-overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:400px;border-radius:16px 16px 0 0;padding:18px 18px 22px;max-height:85vh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
.sheet h3{margin:0 0 14px;font-family:'Noto Serif KR',serif;font-size:16px;}
.amount-input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:22px;font-family:'Noto Serif KR',serif;font-weight:700;text-align:right;margin-bottom:10px;font-variant-numeric:tabular-nums;}
.field-row{display:flex;gap:8px;margin-bottom:10px;}
.field-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.cat-pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--paper);}
.cat-pick.selected{border-color:var(--brown-deep);background:#F0E6D2;}
.cat-pick .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
.cat-pick .nm{font-size:10px;color:var(--ink-soft);}
.sheet-btn-row{display:flex;gap:8px;}
</style>
</head>
<body>
<div class="phone">

  <div class="topbar">
    <div class="topbar-row1">
      <div class="app-title">지출 관리</div>
      <div class="month-switch">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="summary-strip">
      <div class="summary-cell"><div class="label">총 지출</div><div class="value" id="sTotal">₩0</div></div>
      <div class="summary-cell"><div class="label">건수</div><div class="value" id="sCount">0건</div></div>
      <div class="summary-cell"><div class="label">일 평균</div><div class="value" id="sAvg">₩0</div></div>
    </div>
  </div>

  <div class="content" id="viewList">
    <div class="filter-bar" id="filterChips"></div>
    <div id="expenseListWrap"></div>
  </div>

  <div class="content" id="viewStats" style="display:none;">
    <div class="stats-section">
      <div class="stats-title">이번 달 카테고리 비중</div>
      <div class="donut-wrap"><div class="donut" id="donut"><div class="donut-hole"><div class="lbl">총 지출</div><div class="amt" id="donutTotal">₩0</div></div></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="stats-section" style="padding-top:0;">
      <div class="stats-title">최근 6개월 지출 추이</div>
      <div class="trend-wrap" id="trendWrap"></div>
    </div>
  </div>

  <div class="content" id="viewSettings" style="display:none;">
    <div class="settings-section">
      <div class="settings-card">
        <h4>카테고리 및 예산</h4>
        <div id="categoryBudgetList"></div>
        <button class="add-cat-btn" onclick="startAddCategory()">＋ 카테고리 추가</button>
      </div>
    </div>
  </div>

  <button class="fab" onclick="openSheet()">＋</button>

  <div class="tabbar">
    <button class="tab active" data-tab="list" onclick="switchView('list')"><span class="ic">📋</span>내역</button>
    <button class="tab" data-tab="stats" onclick="switchView('stats')"><span class="ic">📊</span>통계</button>
    <button class="tab" data-tab="settings" onclick="switchView('settings')"><span class="ic">⚙️</span>설정</button>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheetIfOverlay(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle">지출 추가</h3>
      <input type="number" class="amount-input" id="fAmount" placeholder="0원">
      <div class="field-row">
        <input type="date" id="fDate">
        <input type="text" id="fMemo" placeholder="메모 (예: 스타벅스)">
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="sheet-btn-row">
        <button class="btn ghost" id="deleteBtn" style="display:none;" onclick="deleteFromSheet()">삭제</button>
        <button class="btn ghost" onclick="closeSheet()">취소</button>
        <button class="btn" onclick="submitExpense()">저장</button>
      </div>
    </div>
  </div>

</div>

<script>
const DEFAULT_CATEGORIES = [
  {name:'식비',    color:'#D9822B', icon:'🍙'},
  {name:'교통',    color:'#3B7CA6', icon:'🚌'},
  {name:'쇼핑',    color:'#9B5FBF', icon:'🛍️'},
  {name:'생활',    color:'#5E8C54', icon:'🧺'},
  {name:'의료',    color:'#C1495A', icon:'💊'},
  {name:'구독',    color:'#2E7D7D', icon:'🔁'},
  {name:'PET',     color:'#B08533', icon:'🐾'},
  {name:'보험',    color:'#5C6B8C', icon:'🛡️'},
  {name:'계',      color:'#7A5738', icon:'🤝'},
  {name:'예.적금', color:'#1F6B4F', icon:'💰'},
  {name:'기타',    color:'#7A7267', icon:'✳️'},
];
let CATEGORIES = [];
const EXP_KEY = 'gagyebu:expenses';
const BUDGET_KEY = 'gagyebu:budgets';
const CATEGORY_KEY = 'gagyebu:categories';

let state = {
  expenses: [],
  budgets: {},
  currentMonth: new Date().toISOString().slice(0,7),
  filterCategory: null,
  selectedFormCategory: '',
  editingId: null,
  activeView: 'list',
  categoryEditIndex: null,
};

function fmt(n){ return '₩' + Math.round(n).toLocaleString('ko-KR'); }
function catInfo(name){ return CATEGORIES.find(c=>c.name===name) || {color:'#999', icon:'✳️'}; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function loadData(){
  try{
    const rc = localStorage.getItem(CATEGORY_KEY);
    const loaded = rc ? JSON.parse(rc) : null;
    CATEGORIES.push(...(loaded && loaded.length ? loaded : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES))));
  }catch(e){
    CATEGORIES.push(...JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)));
  }
  try{ const r = localStorage.getItem(EXP_KEY); state.expenses = r ? JSON.parse(r) : []; }
  catch(e){ state.expenses = []; }
  try{ const r2 = localStorage.getItem(BUDGET_KEY); state.budgets = r2 ? JSON.parse(r2) : {}; }
  catch(e){ state.budgets = {}; }
  state.selectedFormCategory = CATEGORIES[0] ? CATEGORIES[0].name : '';
  document.getElementById('fDate').value = todayStr();
  render();
}
function saveExpenses(){
  try{ localStorage.setItem(EXP_KEY, JSON.stringify(state.expenses)); }
  catch(e){ alert('저장에 실패했어요. 다시 시도해주세요.'); }
}
function saveBudgetsToStorage(){
  try{ localStorage.setItem(BUDGET_KEY, JSON.stringify(state.budgets)); }
  catch(e){ alert('예산 저장에 실패했어요.'); }
}
function saveCategories(){
  try{ localStorage.setItem(CATEGORY_KEY, JSON.stringify(CATEGORIES)); }
  catch(e){ alert('카테고리 저장에 실패했어요.'); }
}

function changeMonth(delta){
  const [y,m] = state.currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.currentMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}
function monthExpenses(month){
  month = month || state.currentMonth;
  return state.expenses.filter(e => e.date.slice(0,7) === month);
}

function switchView(v){
  state.activeView = v;
  ['list','stats','settings'].forEach(name=>{
    document.getElementById('view'+name.charAt(0).toUpperCase()+name.slice(1)).style.display = name===v ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===v));
  document.querySelector('.fab').style.display = v==='list' ? 'block' : 'none';
  render();
}

function render(){
  const [y,m] = state.currentMonth.split('-');
  document.getElementById('monthLabel').textContent = `${y}년 ${Number(m)}월`;

  const list = monthExpenses();
  const total = list.reduce((s,e)=>s+e.amount,0);
  document.getElementById('sTotal').textContent = fmt(total);
  document.getElementById('sCount').textContent = list.length + '건';

  const now = new Date();
  const isCurrentRealMonth = state.currentMonth === now.toISOString().slice(0,7);
  const daysInMonth = new Date(Number(y), Number(m), 0).getDate();
  const elapsed = isCurrentRealMonth ? now.getDate() : daysInMonth;
  document.getElementById('sAvg').textContent = fmt(elapsed ? total/elapsed : 0);

  if(state.activeView === 'list') renderList(list);
  if(state.activeView === 'stats') renderStats(list, total);
  if(state.activeView === 'settings') renderSettings();
}

function renderList(list){
  const filterWrap = document.getElementById('filterChips');
  filterWrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (state.filterCategory===null?' selected':'');
  allChip.textContent = '전체';
  allChip.onclick = ()=>{ state.filterCategory=null; render(); };
  filterWrap.appendChild(allChip);
  CATEGORIES.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.filterCategory===c.name?' selected':'');
    chip.textContent = c.icon + ' ' + c.name;
    chip.onclick = ()=>{ state.filterCategory = state.filterCategory===c.name?null:c.name; render(); };
    filterWrap.appendChild(chip);
  });

  const wrap = document.getElementById('expenseListWrap');
  wrap.innerHTML = '';
  let filtered = state.filterCategory ? list.filter(e=>e.category===state.filterCategory) : list;
  if(filtered.length===0){
    wrap.innerHTML = '<div class="empty-state">이번 달 지출 내역이 없어요.<br>오른쪽 아래 ＋ 버튼으로 추가해보세요.</div>';
    return;
  }
  filtered = [...filtered].sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  const byDate = {};
  filtered.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });

  Object.keys(byDate).sort().reverse().forEach(date=>{
    const dObj = new Date(date);
    const weekday = ['일','월','화','수','목','금','토'][dObj.getDay()];
    const dayTotal = byDate[date].reduce((s,e)=>s+e.amount,0);
    const group = document.createElement('div');
    group.className = 'day-group';
    group.innerHTML = `<div class="day-header">
        <div class="day-badge">${dObj.getDate()}</div>
        <div class="day-meta">${dObj.getMonth()+1}월 ${dObj.getDate()}일 (${weekday})<br><b>${fmt(dayTotal)}</b></div>
      </div>`;
    byDate[date].forEach(e=>{
      const c = catInfo(e.category);
      const row = document.createElement('div');
      row.className = 'expense-row';
      row.onclick = ()=> editExpense(e.id);
      row.innerHTML = `
        <div class="cat-icon" style="background:${c.color}">${c.icon}</div>
        <div class="row-text">
          <div class="memo">${e.memo || e.category}</div>
          <div class="cat-name">${e.category}</div>
        </div>
        <div class="row-amount">-${fmt(e.amount)}</div>
      `;
      group.appendChild(row);
    });
    wrap.appendChild(group);
  });
}

function renderStats(list, total){
  const byCat = {};
  CATEGORIES.forEach(c=>byCat[c.name]=0);
  list.forEach(e=> byCat[e.category] = (byCat[e.category]||0)+e.amount);

  document.getElementById('donutTotal').textContent = fmt(total);
  const donut = document.getElementById('donut');
  const legend = document.getElementById('legend');
  legend.innerHTML = '';

  if(total === 0){
    donut.style.background = '#E5DFD1';
    legend.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);text-align:center;padding:10px;">이번 달 지출 내역이 없어요.</div>';
  } else {
    let acc = 0;
    const stops = [];
    CATEGORIES.forEach(c=>{
      const amt = byCat[c.name];
      if(amt <= 0) return;
      const pct = amt/total*100;
      const start = acc, end = acc+pct;
      stops.push(`${c.color} ${start}% ${end}%`);
      acc = end;
    });
    donut.style.background = `conic-gradient(${stops.join(',')})`;

    CATEGORIES.slice().sort((a,b)=>byCat[b.name]-byCat[a.name]).forEach(c=>{
      const amt = byCat[c.name];
      if(amt <= 0) return;
      const pct = (amt/total*100).toFixed(1);
      const budget = state.budgets[c.name];
      const exceeded = budget && amt > budget;
      let budgetLine = '';
      if(budget){
        const bpct = Math.min(100, (amt/budget)*100);
        budgetLine = `<div class="legend-budget">
            <div class="legend-budget-track"><div class="legend-budget-fill" style="width:${bpct}%;background:${exceeded ? 'var(--red)' : c.color}"></div></div>
            <span class="${exceeded ? 'legend-budget-over' : 'legend-budget-ok'}">${exceeded ? `예산 ${fmt(budget)} · ${fmt(amt-budget)} 초과` : `예산 ${fmt(budget)} · ${fmt(budget-amt)} 남음`}</span>
          </div>`;
      }
      const row = document.createElement('div');
      row.className = 'legend-row-wrap';
      row.innerHTML = `<div class="legend-row">
          <span class="legend-dot" style="background:${c.color}"></span>
          <span class="legend-name">${c.icon} ${c.name}</span>
          <span class="legend-pct">${pct}%</span>
          <span class="legend-amt"${exceeded ? ' style="color:var(--red);"' : ''}>${fmt(amt)}${exceeded ? ' ⚠' : ''}</span>
        </div>${budgetLine}`;
      legend.appendChild(row);
    });
  }

  // trend: last 6 months
  const trendWrap = document.getElementById('trendWrap');
  trendWrap.innerHTML = '';
  const months = [];
  const [cy,cm] = state.currentMonth.split('-').map(Number);
  for(let i=5;i>=0;i--){
    const d = new Date(cy, cm-1-i, 1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const totals = months.map(mo => monthExpenses(mo).reduce((s,e)=>s+e.amount,0));
  const max = Math.max(...totals, 1);
  months.forEach((mo,i)=>{
    const [,mm] = mo.split('-');
    const h = Math.max(4, (totals[i]/max)*100);
    const col = document.createElement('div');
    col.className = 'trend-bar-col';
    col.innerHTML = `<div class="trend-amt">${totals[i]>0 ? Math.round(totals[i]/1000)+'k' : ''}</div>
      <div class="trend-bar${mo===state.currentMonth?' current':''}" style="height:${h}%"></div>
      <div class="trend-label">${Number(mm)}월</div>`;
    trendWrap.appendChild(col);
  });
}

function renderSettings(){
  renderCategoryManage();
}

/* ---- 카테고리 및 예산 (한 줄 병합) ---- */
function renderCategoryManage(){
  const wrap = document.getElementById('categoryBudgetList');
  if(!wrap) return;
  wrap.innerHTML = '';
  CATEGORIES.forEach((c, idx)=>{
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    if(state.categoryEditIndex === idx){
      row.innerHTML = `
        <input type="text" id="editIcon_${idx}" value="${c.icon}" maxlength="4" class="cm-icon-input">
        <input type="text" id="editName_${idx}" value="${c.name}" class="cm-name-input">
        <input type="color" id="editColor_${idx}" value="${c.color}" class="cm-color-input">
        <button class="cm-icon-btn" onclick="saveCategoryEdit(${idx})">✔️</button>
        <button class="cm-icon-btn" onclick="cancelCategoryEdit()">✕</button>
      `;
    } else {
      row.innerHTML = `
        <span class="cm-icon" style="background:${c.color}">${c.icon}</span>
        <span class="cm-name">${c.name}</span>
        <input type="number" class="cm-budget-input" data-cat="${c.name}" value="${state.budgets[c.name]||''}" placeholder="미설정" onchange="updateBudget(this)">
        <button class="cm-icon-btn" onclick="startEditCategory(${idx})">✏️</button>
        <button class="cm-icon-btn" onclick="deleteCategory(${idx})">🗑</button>
      `;
    }
    wrap.appendChild(row);
  });
  if(state.categoryEditIndex === 'new'){
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    row.innerHTML = `
      <input type="text" id="editIcon_new" value="✳️" maxlength="4" class="cm-icon-input">
      <input type="text" id="editName_new" placeholder="카테고리명" class="cm-name-input">
      <input type="color" id="editColor_new" value="#7A7267" class="cm-color-input">
      <button class="cm-icon-btn" onclick="saveCategoryEdit('new')">✔️</button>
      <button class="cm-icon-btn" onclick="cancelCategoryEdit()">✕</button>
    `;
    wrap.appendChild(row);
  }
}
function updateBudget(el){
  const name = el.dataset.cat;
  const v = Number(el.value);
  if(v>0) state.budgets[name]=v; else delete state.budgets[name];
  saveBudgetsToStorage();
}
function startEditCategory(idx){ state.categoryEditIndex = idx; renderCategoryManage(); }
function startAddCategory(){ state.categoryEditIndex = 'new'; renderCategoryManage(); }
function cancelCategoryEdit(){ state.categoryEditIndex = null; renderCategoryManage(); }

function saveCategoryEdit(idx){
  const isNew = idx === 'new';
  const icon = document.getElementById(`editIcon_${idx}`).value.trim() || '✳️';
  const name = document.getElementById(`editName_${idx}`).value.trim();
  const color = document.getElementById(`editColor_${idx}`).value;
  if(!name){ alert('카테고리 이름을 입력해주세요.'); return; }
  const dup = CATEGORIES.some((c,i)=> c.name===name && i!==idx);
  if(dup){ alert('이미 있는 카테고리 이름이에요.'); return; }

  if(isNew){
    CATEGORIES.push({name, icon, color});
  } else {
    const oldName = CATEGORIES[idx].name;
    CATEGORIES[idx] = {name, icon, color};
    if(oldName !== name){
      state.expenses.forEach(e=>{ if(e.category===oldName) e.category=name; });
      if(state.budgets[oldName]!==undefined){ state.budgets[name]=state.budgets[oldName]; delete state.budgets[oldName]; }
      if(state.filterCategory===oldName) state.filterCategory=name;
      if(state.selectedFormCategory===oldName) state.selectedFormCategory=name;
      saveExpenses();
      saveBudgetsToStorage();
    }
  }
  state.categoryEditIndex = null;
  saveCategories();
  renderCategoryManage();
  render();
}

function deleteCategory(idx){
  const c = CATEGORIES[idx];
  const inUse = state.expenses.some(e=>e.category===c.name);
  if(inUse){ alert(`'${c.name}' 카테고리를 사용 중인 지출 내역이 있어 삭제할 수 없어요. 먼저 해당 항목들의 카테고리를 바꿔주세요.`); return; }
  if(CATEGORIES.length<=1){ alert('카테고리가 최소 1개는 있어야 해요.'); return; }
  if(!confirm(`'${c.name}' 카테고리를 삭제할까요?`)) return;
  delete state.budgets[c.name];
  CATEGORIES.splice(idx,1);
  if(state.filterCategory===c.name) state.filterCategory=null;
  if(state.selectedFormCategory===c.name) state.selectedFormCategory = CATEGORIES[0] ? CATEGORIES[0].name : '';
  saveCategories();
  saveBudgetsToStorage();
  renderCategoryManage();
  render();
}

/* ---- bottom sheet (add/edit) ---- */
function renderCatGrid(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'cat-pick' + (state.selectedFormCategory===c.name?' selected':'');
    el.innerHTML = `<div class="ic" style="background:${c.color}">${c.icon}</div><div class="nm">${c.name}</div>`;
    el.onclick = ()=>{ state.selectedFormCategory = c.name; renderCatGrid(); };
    grid.appendChild(el);
  });
}
function openSheet(){
  state.editingId = null;
  document.getElementById('sheetTitle').textContent = '지출 추가';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('fAmount').value = '';
  document.getElementById('fMemo').value = '';
  document.getElementById('fDate').value = todayStr();
  state.selectedFormCategory = CATEGORIES[0].name;
  renderCatGrid();
  document.getElementById('sheetOverlay').classList.add('show');
}
function editExpense(id){
  const e = state.expenses.find(x=>x.id===id);
  if(!e) return;
  state.editingId = id;
  document.getElementById('sheetTitle').textContent = '지출 수정';
  document.getElementById('deleteBtn').style.display = 'inline-block';
  document.getElementById('fAmount').value = e.amount;
  document.getElementById('fMemo').value = e.memo;
  document.getElementById('fDate').value = e.date;
  state.selectedFormCategory = e.category;
  renderCatGrid();
  document.getElementById('sheetOverlay').classList.add('show');
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
function closeSheetIfOverlay(ev){ if(ev.target.id==='sheetOverlay') closeSheet(); }

function submitExpense(){
  const amount = Number(document.getElementById('fAmount').value);
  const date = document.getElementById('fDate').value || todayStr();
  const memo = document.getElementById('fMemo').value.trim();
  const category = state.selectedFormCategory;
  if(!amount || amount<=0){ alert('금액을 입력해주세요.'); return; }

  if(state.editingId){
    const idx = state.expenses.findIndex(e=>e.id===state.editingId);
    if(idx>-1) state.expenses[idx] = {...state.expenses[idx], amount, date, memo, category};
  } else {
    state.expenses.push({id:Date.now(), amount, date, memo, category});
  }
  saveExpenses();
  closeSheet();
  render();
}
function deleteFromSheet(){
  if(!state.editingId) return;
  if(!confirm('이 지출 내역을 삭제할까요?')) return;
  state.expenses = state.expenses.filter(e=>e.id!==state.editingId);
  saveExpenses();
  closeSheet();
  render();
}

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
